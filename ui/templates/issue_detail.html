{% extends "base.html" %}
{% import "macros.html" as m %}
{% block title %}{{ issue.issue_id }} - {{ case_id }}{% endblock %}
{% block content %}

  <h1>{{ issue.issue_id }}</h1>
  <p class="muted">{{ issue.title }}</p>
  {{ m.render_value(issue) }}
{% endblock %}
